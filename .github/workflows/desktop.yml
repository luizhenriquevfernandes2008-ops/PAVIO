# Monta o instalador do Windows (PAVIO-Setup.exe) num Windows de verdade.
# - push na main: monta e publica a Release "v<versão do package.json>" com o instalador
#   (versão nova = suba o "version" no package.json; a mesma versão só troca o arquivo)
# - outras branches: só gera o instalador como "artifact" (aba Actions)
name: Desktop (Windows)

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'electron/**'
      - 'build/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar o Phaser, o Electron e o empacotador
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Montar o jogo e o instalador
        run: npm run dist

      - name: Versão
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Guardar o instalador (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PAVIO-Windows
          path: release/PAVIO-Setup-*.exe
          retention-days: 30

      - name: Publicar a Release no GitHub
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PAVIO ${{ steps.ver.outputs.version }}
          files: release/PAVIO-Setup-*.exe
          make_latest: true
          body: |
            ## 📥 Como instalar
            1. Baixe o **PAVIO-Setup-${{ steps.ver.outputs.version }}.exe** aqui embaixo.
            2. Abra e siga o instalador.
            3. Jogue pelo atalho **PAVIO**.

            Se o Windows mostrar "O Windows protegeu o computador": **Mais informações → Executar assim mesmo**.

            🕯️ Um jogo da **WW STUDIOS**, por Luiz Vargas.
